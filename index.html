<script>
'use strict';
(()=>{ // ============================ ナゴヤ人間RUN — Phase 2（全コース版） ============================

// ---------- 基本定数 ----------
const W=960, H=540, GROUND=470, TAU=Math.PI*2;
const PHYS={ g:2400, gHold:1150, jumpV:700, djV:640, holdMax:0.18, coyote:0.08, buffer:0.12 };
const tapAir = 2*PHYS.jumpV/PHYS.g;              // ≒0.583s
const jd = s => tapAir*s;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const TXT_FONT='"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
  const m=v=>clamp(Math.round(f<1?v*f:v+(255-v)*(f-1)),0,255);
  return '#'+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1);
}
function heart(c,x,y,s,col){
  c.fillStyle=col;c.beginPath();
  c.moveTo(x,y+s);
  c.bezierCurveTo(x-s*1.25,y+s*0.25,x-s*1.05,y-s*0.85,x,y-s*0.2);
  c.bezierCurveTo(x+s*1.05,y-s*0.85,x+s*1.25,y+s*0.25,x,y+s);
  c.fill();
}
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

// ---------- キャンバス ----------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let VIEW={scale:1};
function fit(){

  VIEW.scale=s;
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
  cv.width=Math.round(W*s*dpr); cv.height=Math.round(H*s*dpr);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}

const LEG={L1:33, L2:31, stand:60};   // 太もも長 / すね長 / 立位の腰→足

};
function farPal(p){const o={};for(const k in p)o[k]=shade(p[k],0.78);return o;}
// 先細りチューブ（断面シリンダー陰影＋丸キャップ）
function tube(c,ax,ay,bx,by,wa,wb,light,base,dark){
  const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len,mx=(ax+bx)/2,my=(ay+by)/2,wm=(wa+wb)/2;
  const g=c.createLinearGradient(mx+nx*wm,my+ny*wm,mx-nx*wm,my-ny*wm);
  g.addColorStop(0,light);g.addColorStop(0.5,base);g.addColorStop(1,dark);
  c.fillStyle=g;
  c.beginPath();c.arc(ax,ay,wa,0,TAU);c.fill();
  c.beginPath();c.arc(bx,by,wb,0,TAU);c.fill();
  c.beginPath();
  c.moveTo(ax+nx*wa,ay+ny*wa);c.lineTo(bx+nx*wb,by+ny*wb);
  c.lineTo(bx-nx*wb,by-ny*wb);c.lineTo(ax-nx*wa,ay-ny*wa);c.closePath();c.fill();
}
// 2ボーンIK：hip→foot の間に膝を前向きに置く
function legIK(hx,hy,fx,fy,L1,L2){
  let dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy);
  const dmax=L1+L2-0.4,dmin=Math.abs(L1-L2)+1.5;
  d=clamp(d,dmin,dmax);
  const ba=Math.atan2(dy,dx);
  const efx=hx+Math.cos(ba)*d, efy=hy+Math.sin(ba)*d;
  const cosA=clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1);
  const A1=Math.acos(cosA);
  const ta=ba-A1;                        // 膝を前方（+x）へ
  return {kx:hx+Math.cos(ta)*L1, ky:hy+Math.sin(ta)*L1, fx:efx, fy:efy};
}
function drawShoe(c,fx,fy,ang,pal){
  c.save();c.translate(fx,fy);c.rotate(clamp(ang,-0.5,0.6));
  // ソール（白）
  c.fillStyle=pal.sole; rr(c,-6,0.5,24,5,2.6); c.fill();
  // アッパー（踵→爪先、ややボリューム）
  const g=c.createLinearGradient(0,-8,0,2);
  g.addColorStop(0,pal.shoeL);g.addColorStop(0.55,pal.shoe);g.addColorStop(1,pal.shoeD);
  c.fillStyle=g;
  c.beginPath();
  c.moveTo(-6,1.5);c.lineTo(-6,-4.5);c.quadraticCurveTo(-6,-8,-1,-8);
  c.lineTo(11,-7.5);c.quadraticCurveTo(18,-6.5,18,1.5);c.closePath();c.fill();
  // 履き口の影
  c.fillStyle=pal.shoeD;c.beginPath();c.ellipse(-2,-6.5,3.2,1.6,0,0,TAU);c.fill();
  // 3本ライン
  c.strokeStyle=pal.stripe;c.lineWidth=1.5;c.lineCap='round';
  c.beginPath();c.moveTo(2,-5.5);c.lineTo(4.5,0.5);c.moveTo(5.5,-6);c.lineTo(8,0.5);c.moveTo(9,-6);c.lineTo(11.5,0.5);c.stroke();
  // ソール影
  c.fillStyle=pal.shoeD;rr(c,-6,4.2,24,1.6,0.8);c.fill();
  c.restore();
}
function drawLegV(c,hx,hy,fx,fy,footAng,pal){
  const ik=legIK(hx,hy,fx,fy,LEG.L1,LEG.L2);
  tube(c,hx,hy,ik.kx,ik.ky, 8.4,6.6, pal.pantL,pal.pant,pal.pantD);
  tube(c,ik.kx,ik.ky,ik.fx,ik.fy, 6.6,4.8, pal.pantL,pal.pant,pal.pantD);
  drawShoe(c,ik.fx,ik.fy, footAng!=null?footAng:Math.atan2(ik.fy-ik.ky,ik.fx-ik.kx)-Math.PI/2, pal);
}
function drawArmV(c,sx,sy,sh,el,pal){
  const dir=a=>({x:Math.sin(a),y:Math.cos(a)});
  const u=dir(sh), ex=sx+u.x*ARM.L1, ey=sy+u.y*ARM.L1;
  const v=dir(sh+el), hx=ex+v.x*ARM.L2, hy=ey+v.y*ARM.L2;
  tube(c,sx,sy,ex,ey, 7,6, pal.slvL,pal.slv,pal.slvD);
  tube(c,ex,ey,hx,hy, 6,5, pal.slvL,pal.slv,pal.slvD);
  const hg=c.createRadialGradient(hx-1.3,hy-1.3,0.8,hx,hy,5);
  hg.addColorStop(0,pal.skin);hg.addColorStop(1,pal.skinD);
  c.fillStyle=hg;c.beginPath();c.arc(hx,hy,4.6,0,TAU);c.fill();
  return {hx,hy};
}

// ---------- オーディオ ----------
const AU={ctx:null};
function auInit(){ if(!AU.ctx){ try{ AU.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume(); }
function beep(f0,f1,dur,type,vol,when){
  if(!save.sfx||!AU.ctx) return;
  const t=AU.ctx.currentTime+(when||0);
  const o=AU.ctx.createOscillator(), g=AU.ctx.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol||0.12,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(AU.ctx.destination); o.start(t); o.stop(t+dur+0.02);
}
const SFX={
  jump:()=>beep(280,520,0.13,'square',0.10),
  dj:()=>beep(440,760,0.13,'square',0.10),
  slide:()=>beep(220,140,0.12,'sawtooth',0.05),
  coin:()=>{beep(900,0,0.05,'sine',0.10);beep(1350,0,0.10,'sine',0.10,0.05);},
  item:()=>{beep(660,0,0.08,'triangle',0.13);beep(880,0,0.08,'triangle',0.13,0.07);beep(1320,0,0.14,'triangle',0.13,0.14);},
  perfect:()=>{beep(990,0,0.06,'sine',0.12);beep(1480,0,0.10,'sine',0.12,0.05);},
  hit:()=>beep(180,70,0.25,'sawtooth',0.16),
  fall:()=>beep(500,80,0.6,'sine',0.14),
  dead:()=>{beep(300,60,0.5,'sawtooth',0.14);},
  ui:()=>beep(520,0,0.05,'square',0.06),
  go:()=>beep(660,990,0.18,'square',0.10),
  clear:()=>{[523,659,784,1047,1319].forEach((f,i)=>beep(f,0,0.18,'triangle',0.13,i*0.11));},
  fanfare:()=>{[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>beep(f,0,0.2,'triangle',0.14,i*0.13));},
};

// ---------- BGM（WebAudioステップシーケンサ・コース別） ----------
const BGM={step:0,next:0,conf:null};
const BGM_CONF={
  menu:       {bpm:96, root:57, scale:[0,3,5,7,10], energy:0.5},
  station:    {bpm:118,root:60, scale:[0,2,4,7,9],  energy:0.7},
  osu:        {bpm:124,root:62, scale:[0,2,4,7,9],  energy:0.85},
  hisaya:     {bpm:116,root:64, scale:[0,2,4,7,9],  energy:0.65},
  oasis:      {bpm:100,root:57, scale:[0,3,5,7,10], energy:0.55},
  castle:     {bpm:112,root:55, scale:[0,2,3,7,8],  energy:0.75},
  atsuta:     {bpm:96, root:52, scale:[0,2,3,7,8],  energy:0.5},
  aquarium:   {bpm:120,root:60, scale:[0,2,4,7,9],  energy:0.7},
  higashiyama:{bpm:118,root:62, scale:[0,2,4,7,9],  energy:0.7},
  igarena:    {bpm:128,root:57, scale:[0,3,5,7,10], energy:1.0},
};
const midi=n=>440*Math.pow(2,(n-69)/12);
function bgmNote(freq,t,dur,type,vol){
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(AU.ctx.destination);o.start(t);o.stop(t+dur+0.03);
}
function bgmNoise(t,dur,vol,hp){
  const len=Math.floor(AU.ctx.sampleRate*dur);
  const buf=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=AU.ctx.createBufferSource();s.buffer=buf;
  const f=AU.ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp||6000;
  const g=AU.ctx.createGain();g.gain.value=vol;
  s.connect(f).connect(g).connect(AU.ctx.destination);s.start(t);
}
function bgmKick(t,vol){
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type='sine';o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(42,t+0.10);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.connect(g).connect(AU.ctx.destination);o.start(t);o.stop(t+0.2);
}
function bgmSet(key){
  BGM.conf = key? Object.assign({key},BGM_CONF[key]) : null;
  BGM.step=0; if(AU.ctx)BGM.next=AU.ctx.currentTime+0.06;
}
function bgmTick(){
  if(!AU.ctx||!save.sfx||!BGM.conf)return;
  if(BGM.next<AU.ctx.currentTime-0.5)BGM.next=AU.ctx.currentTime+0.05;
  const cf=BGM.conf, spb=60/cf.bpm/2;
  while(BGM.next<AU.ctx.currentTime+0.26){
    const t=BGM.next, s=BGM.step%16, bar=Math.floor(BGM.step/16)%4;
    const sc=cf.scale, root=cf.root;
    if(cf.energy>=0.9? s%4===0 : (s===0||s===6||s===10)) bgmKick(t,0.20*cf.energy);
    if(s%2===0) bgmNoise(t,0.04,0.028+(s%4===2?0.014:0),7000);
    if(s===4||s===12) bgmNoise(t,0.09,0.05*cf.energy,2400);
    if(s%4===0){
      const opts=[0,0,sc[3],sc[4]>7?sc[4]-12:sc[4]];
      bgmNote(midi(root-24+opts[(s/4+bar)%4]),t,spb*1.8,'triangle',0.10*cf.energy);
    }
    if(bar>=1&&s%2===1&&((s*7+bar*5)%3)){
      const idx=(s*3+bar*2)%sc.length;
      const oct=((s+bar)%4===3)?12:0;
      bgmNote(midi(root+sc[idx]+oct),t,spb*0.9,'square',0.026*cf.energy);
    }
    if(s===0){
      bgmNote(midi(root-12),t,spb*14,'sine',0.034);
      bgmNote(midi(root-12+sc[2]),t,spb*14,'sine',0.027);
    }
    BGM.next+=spb; BGM.step++;
  }
}
setInterval(bgmTick,90);

// ---------- 入力 ----------
const IN={jumpHeld:false, slideHeld:false, jumpBuf:0, slidePulse:false, ptr:{x:-99,y:-99,down:false,clicked:false}};
function ptrPos(e){
  const r=cv.getBoundingClientRect();
  const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  return {x:(t.clientX-r.left)/VIEW.scale, y:(t.clientY-r.top)/VIEW.scale};
}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
  auInit();
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){IN.jumpHeld=true;IN.jumpBuf=PHYS.buffer;keyConfirm();}
  if(e.code==='ArrowDown'||e.code==='KeyS'){IN.slideHeld=true;IN.slidePulse=true;}
  if(e.code==='KeyP'||e.code==='Escape'){togglePause();}
  if(e.code==='KeyM'){save.sfx=!save.sfx;persist();}
  if(e.code==='KeyH'){DEBUG.hit=!DEBUG.hit;}
  if(e.code==='KeyR'){quickRetry();}
  if(e.code==='ArrowLeft')menuNav(-1);
  if(e.code==='ArrowRight')menuNav(1);
  if(e.code==='Enter')keyConfirm(true);
});
addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')IN.jumpHeld=false;
  if(e.code==='ArrowDown'||e.code==='KeyS')IN.slideHeld=false;
});
let touchSides={};

  e.preventDefault(); auInit();

// ---------- スケルトンアニメーション ----------
const SK={UL:24, LL:24, TORSO:34, NECK:13, HEADR:16, UA:18, LA:16, LEGW:13, ARMW:9, TORSOW:27};
function pt(x,y,a,len){ return {x:x+Math.sin(a)*len, y:y+Math.cos(a)*len}; }

function computePose(o){
  const P={pelvisY:-52,lean:0.15,hipL:0,kneeL:0.1,hipR:0,kneeR:0.1,shL:0,elL:0.4,shR:0,elR:0.4,headTilt:0};
  const f=o.phase||0;
  if(o.state==='run'){
    const hip=p=>Math.sin(p)*0.78;
    const knee=p=>0.16+Math.max(0,Math.cos(p))*1.25;
    P.hipL=hip(f); P.kneeL=knee(f);
    P.hipR=hip(f+Math.PI); P.kneeR=knee(f+Math.PI);
    P.shL=-Math.sin(f)*0.72+0.08; P.elL=0.92;
    P.shR= Math.sin(f)*0.72+0.08; P.elR=0.92;
    P.pelvisY=-52+Math.sin(2*f-0.6)*3.4;
    P.lean=0.15+(o.speedN||0)*0.16;
    P.headTilt=Math.sin(2*f)*0.04;
  }else if(o.state==='jump'){
    const m=clamp(((o.vy01||0)+1)/2,0,1);
    P.hipL=lerp(0.95,1.18,m);  P.kneeL=lerp(1.65,0.22,m);
    P.hipR=lerp(-0.20,-0.62,m);P.kneeR=lerp(1.85,1.05,m);
    P.shL=lerp(0.95,0.35,m);   P.elL=0.7;
    P.shR=lerp(-1.05,-0.30,m); P.elR=0.7;
    P.lean=0.24; P.pelvisY=-52;
  }else if(o.state==='slide'){
    P.pelvisY=-26; P.lean=-1.02;
    P.hipL=1.38; P.kneeL=0.10;
    P.hipR=0.18; P.kneeR=1.45;
    P.shL=-0.65; P.elL=0.45;
    P.shR=0.62;  P.elR=0.85;
    P.headTilt=0.35;
  }else if(o.state==='idle'){
    const b=Math.sin((o.t||0)*2.2)*1.4;
    P.pelvisY=-52+b*0.6; P.lean=0.03;
    P.hipL=0.06;P.kneeL=0.08;P.hipR=-0.06;P.kneeR=0.08;
    P.shL=0.06;P.elL=0.28;P.shR=-0.06;P.elR=0.28;
  }
  return P;
}

// ===== ランナー（実画像の頭・胴 ＋ IK駆動ベクター四肢） =====
function loco(o){
  // 返り値: lean, headTilt, pelY, nF/fF(足:腰相対 {x,y,a}), nA/fA(腕:{sh,el})
  const st=o.state, ph=o.phase||0, sp=clamp(o.speedN||0,0,1);
  const ease=s=>s<0.5?2*s*s:1-2*(1-s)*(1-s);
  function runFoot(p){
    let u=(((p%TAU)+TAU)%TAU)/TAU;
    const stance=0.40, A=15+sp*4, lift=20+sp*6;
    let x,y,a;
    if(u<stance){ const s=u/stance; x=lerp(A,-A,s); y=0; a=lerp(-0.18,0.34,s); }      // 接地：踵→爪先
    else{ const s=(u-stance)/(1-stance); x=lerp(-A,A,ease(s)); y=-lift*Math.sin(s*Math.PI); a=lerp(0.34,-0.18,ease(s)); }
    return {x,y,a};
  }
  function runArm(p){ return {sh:Math.sin(p)*0.52-0.08, el:1.5-Math.max(0,Math.sin(p))*0.28}; }
  if(st==='run'){
    const bob=Math.cos(2*ph+0.4)*3.0;
    return {lean:0.17+sp*0.12, headTilt:Math.sin(2*ph)*0.03, pelY:-(LEG.stand)+bob,
      nF:runFoot(ph), fF:runFoot(ph+Math.PI), nA:runArm(ph+Math.PI), fA:runArm(ph)};
  }
  if(st==='jump'){
    const m=clamp(((o.vy01||0)+1)/2,0,1);            // 0=上昇 1=落下（足Yは画面座標:0=地面）
    const nF={x:lerp(9,14,m), y:lerp(-36,-8,m), a:lerp(0.5,-0.1,m)};
    const fF={x:lerp(-7,-13,m), y:lerp(-30,-2,m), a:lerp(0.3,0.1,m)};
    return {lean:0.24, headTilt:0.04, pelY:-(LEG.stand),
      nF, fF, nA:{sh:lerp(-1.0,-0.4,m), el:1.0}, fA:{sh:lerp(-1.2,-0.6,m), el:1.0}};
  }
  if(st==='slide'){
    return {lean:-0.85, headTilt:0.32, pelY:-26,
      nF:{x:30,y:0,a:0.45}, fF:{x:-10,y:0,a:0.1},
      nA:{sh:0.7,el:0.5}, fA:{sh:-0.8,el:0.9}};
  }
  // idle
  const b=Math.sin((o.t||0)*2.2)*1.2;
  return {lean:0.05, headTilt:0, pelY:-(LEG.stand)+b*0.4,
    nF:{x:6,y:0,a:0.05}, fF:{x:-6,y:0,a:0.05},
    nA:{sh:0.06,el:0.5}, fA:{sh:-0.04,el:0.5}};
}
function drawRunner(c,x,gy,o){
  const cw=CHAR_CW[o.char]||'base';
  const at=SPRITES[cw];
  const pal=LIMB_PAL[cw]||LIMB_PAL.base, palF=farPal(pal);
  const P=loco(o);
  const rot2=(vx,vy,a)=>({x:vx*Math.cos(a)-vy*Math.sin(a), y:vx*Math.sin(a)+vy*Math.cos(a)});
  c.save();
  c.translate(x,gy);
  if(o.scale)c.scale(o.scale,o.scale);
  if(o.flash!==undefined)c.globalAlpha=o.flash;
  if(o.shadow!==false){
    const surf=o.shadowSurf||0;
    const air=clamp(((o.airY||0)-surf)/170,0,1);
    c.save();c.globalAlpha=(o.flash!==undefined?o.flash:1)*0.20*(1-air*0.6);
    c.fillStyle='#000';c.beginPath();
    c.ellipse(0,-2-surf,36*(1-air*0.35),7.5*(1-air*0.35),0,0,TAU);c.fill();c.restore();
  }
  c.translate(0,-(o.airY||0));
  if(o.squash){ c.scale(o.squash.x,o.squash.y); }
  const pelY=P.pelY;
  if(o.spin){ c.translate(0,pelY); c.rotate(o.spin*TAU); c.translate(0,-pelY); }
  if(o.rot){ c.translate(0,pelY); c.rotate(o.rot); c.translate(0,-pelY); }
  const lean=P.lean;
  const pel={x:0,y:pelY};
  const tv=rot2(SK2.TORSO[0]*AS, SK2.TORSO[1]*AS, lean);
  const neck={x:pel.x+tv.x, y:pel.y+tv.y};
  const shv=rot2(-1,12,lean);
  const sh={x:neck.x+shv.x, y:neck.y+shv.y};
  const headAng=lean*0.8+P.headTilt;
  const hc={x:neck.x+Math.sin(headAng)*10, y:neck.y-Math.cos(headAng)*10};

  function part(name,jx,jy,ang,piv){
    if(!at)return;
    const m=SPR[name];
    const pvx=piv?piv[0]:m.px, pvy=piv?piv[1]:m.py;
    c.save(); c.translate(jx,jy); c.rotate(ang);
    c.drawImage(at,m.x,m.y,m.w,m.h, -pvx*AS,-pvy*AS, m.w*AS,m.h*AS);
    c.restore();
  }
  // 奥腕
  drawArmV(c, sh.x-2.5, sh.y, P.fA.sh+lean*0.6, P.fA.el, palF);
  // 奥脚（足Yは画面座標。0=地面）
  drawLegV(c, pel.x-2.5, pel.y+2, pel.x-2.5+P.fF.x, P.fF.y, P.fF.a, palF);
  // ランドセル（胴の後ろ）
  if(o.char==='randoseru'){
    const lag=o.bagLag||0, bp=rot2(-20,-56,lean);
    c.save();c.translate(pel.x+bp.x, pel.y+bp.y+lag);c.rotate(lean*0.6);
    const g=c.createLinearGradient(-12,-16,10,16);
    g.addColorStop(0,'#4a85e8');g.addColorStop(0.5,'#2f6fd6');g.addColorStop(1,'#1d4ea3');
    c.fillStyle=g; rr(c,-12,-16,23,32,7); c.fill();
    c.fillStyle='rgba(255,255,255,0.25)'; rr(c,-12,-16,23,9,7); c.fill();
    c.strokeStyle='#16407e';c.lineWidth=2; rr(c,-12,-16,23,32,7); c.stroke();
    c.fillStyle='#d8d8dc'; rr(c,-4.5,-3,8,7,2); c.fill();
    c.restore();
    c.strokeStyle='#2f6fd6';c.lineWidth=4;c.lineCap='round';
    c.beginPath();c.moveTo(sh.x+1,sh.y-1);c.lineTo(pel.x+bp.x+9,pel.y+bp.y+lag-8);c.stroke();
  }
  // 胴
  part('torso',pel.x,pel.y,lean,SPR.torso.hip);
  // 近脚（胴の前）
  drawLegV(c, pel.x+2.5, pel.y+2, pel.x+2.5+P.nF.x, P.nF.y, P.nF.a, pal);
  // 頭
  part('head',neck.x,neck.y,headAng);
  // アクセサリー
  const ear={x:hc.x-Math.cos(headAng)*8, y:hc.y-Math.sin(headAng)*8+3};
  if(o.char==='earphone'){
    const sway=o.wireSway||0;
    c.strokeStyle='#fafafa';c.lineWidth=1.7;c.lineCap='round';
    c.beginPath();c.moveTo(ear.x,ear.y);
    c.bezierCurveTo(ear.x-8+sway, ear.y+15, neck.x-6+sway*1.6, neck.y+18, pel.x+tv.x*0.4, pel.y-16);
    c.stroke();
    c.fillStyle='#fafafa';c.beginPath();c.arc(ear.x,ear.y,2.3,0,TAU);c.fill();
  }else if(o.char==='headphone'){
    c.strokeStyle='#8a8f98';c.lineWidth=5;c.lineCap='round';
    c.beginPath();c.arc(hc.x-2,hc.y+1,21,Math.PI*1.02,Math.PI*1.92);c.stroke();
    const g=c.createLinearGradient(ear.x-8,ear.y-8,ear.x+6,ear.y+8);
    g.addColorStop(0,'#7d828c');g.addColorStop(1,'#4a4e56');
    c.fillStyle=g; rr(c,ear.x-8,ear.y-9,14,18,6); c.fill();
    c.fillStyle='#2e3138'; rr(c,ear.x-5,ear.y-6,9,12,4); c.fill();
    const fx=hc.x+Math.cos(headAng)*4, fy=hc.y+Math.sin(headAng)*4-2;
    const sg=c.createLinearGradient(fx,fy,fx+11,fy+8);
    sg.addColorStop(0,'#2a2c33');sg.addColorStop(1,'#0c0c10');
    c.fillStyle=sg; rr(c,fx,fy,12,9,3.2); c.fill();
    c.fillStyle='rgba(255,255,255,0.22)'; rr(c,fx+1.5,fy+1.5,4.5,2.6,1.4); c.fill();
  }else if(o.char==='black'){
    const fx=hc.x+9, fy=hc.y-1;
    c.fillStyle='#f2f2f2';c.beginPath();c.ellipse(fx,fy,4.6,5.4,0,0,TAU);c.fill();
    c.fillStyle='#0c0c0f';c.beginPath();c.arc(fx+1.4,fy+1,2.2,0,TAU);c.fill();
  }else if(o.char==='suit'){
    const ch=rot2(9,16,lean);
    c.fillStyle='#f5f5f3';
    c.beginPath();c.moveTo(neck.x+ch.x*0.5,neck.y+ch.y*0.5);
    c.lineTo(neck.x+ch.x*0.5-4,neck.y+ch.y*0.5+9);c.lineTo(neck.x+ch.x*0.5+5,neck.y+ch.y*0.5+7);c.closePath();c.fill();
  }
  if(o.char==='gold'){
    const t=o.t||0;
    c.fillStyle='rgba(255,244,180,0.9)';
    for(let i=0;i<3;i++){
      const a=t*2.4+i*2.1, r2=22+((t*37+i*53)%28);
      const sx2=pel.x+Math.cos(a)*r2, sy2=pel.y-28+Math.sin(a*1.3)*32;
      c.save();c.translate(sx2,sy2);c.rotate(a);
      c.fillRect(-1.2,-4.5,2.4,9);c.fillRect(-4.5,-1.2,9,2.4);c.restore();
    }
  }
  // 近腕（最前）
  drawArmV(c, sh.x+2.5, sh.y, P.nA.sh+lean*0.6, P.nA.el, pal);
  c.restore();
}

function drawRunnerVector(c,x,gy,o){
  const st=CHAR_STYLE[o.char]||BASE_STYLE;
  const P=computePose(o);
  c.save();
  c.translate(x,gy);
  if(o.flash!==undefined)c.globalAlpha=o.flash;
  if(o.shadow!==false){
    const surf=o.shadowSurf||0;
    const air=clamp(((o.airY||0)-surf)/170,0,1);
    c.save();c.globalAlpha=(o.flash!==undefined?o.flash:1)*0.18*(1-air*0.6);
    c.fillStyle='#000';c.beginPath();
    c.ellipse(0,-2-surf,34*(1-air*0.35),7*(1-air*0.35),0,0,TAU);c.fill();c.restore();
  }
  c.translate(0,-(o.airY||0));
  if(o.squash){ c.scale(o.squash.x,o.squash.y); }
  if(o.spin){ c.translate(0,P.pelvisY); c.rotate(o.spin*TAU); c.translate(0,-P.pelvisY); }
  if(o.rot){ c.translate(0,P.pelvisY); c.rotate(o.rot); c.translate(0,-P.pelvisY); }

  const px=0, py=P.pelvisY;
  const up=a=>({x:Math.sin(a),y:-Math.cos(a)});
  const u=up(P.lean);
  const neck={x:px+u.x*SK.TORSO, y:py+u.y*SK.TORSO};
  const sh={x:px+u.x*(SK.TORSO-5), y:py+u.y*(SK.TORSO-5)};
  const hc={x:neck.x+Math.sin(P.lean*0.8+P.headTilt)*SK.NECK, y:neck.y-Math.cos(P.lean*0.8+P.headTilt)*SK.NECK};

  function limb(jx,jy,a1,l1,bendDir,a2off,l2,wid,col){
    const k=pt(jx,jy,a1,l1);
    const f=pt(k.x,k.y,a1+bendDir*a2off,l2);
    c.strokeStyle=col;c.lineWidth=wid;c.lineCap='round';c.lineJoin='round';
    c.beginPath();c.moveTo(jx,jy);c.lineTo(k.x,k.y);c.lineTo(f.x,f.y);c.stroke();
    return {k,f,a:a1+bendDir*a2off};
  }
  function shoe(fp,ang,col,trim){
    c.save();c.translate(fp.x,fp.y);c.rotate(clamp(ang*0.35,-0.5,0.5));
    c.fillStyle=st.sole; rr(c,-9,-3,26,9,4); c.fill();
    c.fillStyle=col; rr(c,-9,-7,26,9,4.5); c.fill();
    c.strokeStyle=trim;c.lineWidth=1.6;
    c.beginPath();c.moveTo(2,-6);c.lineTo(5,1);c.moveTo(7,-6);c.lineTo(10,1);c.stroke();
    c.restore();
  }
  function hand(p,col){ c.fillStyle=col;c.beginPath();c.arc(p.x,p.y,4.6,0,TAU);c.fill(); }

  const pantsFar=shade(st.pants,0.82), topFar=shade(st.top,0.82), skinFar=shade(st.skin,0.85);

  { const r=limb(sh.x-2,sh.y,P.shR+P.lean,SK.UA,1,P.elR,SK.LA,SK.ARMW,topFar); hand(r.f,skinFar); }
  { const r=limb(px-2,py+3,P.hipR,SK.UL,-1,P.kneeR,SK.LL,SK.LEGW,pantsFar);
    shoe(r.f,r.a,shade(st.shoe,0.85),shade(st.shoeTrim,0.85)); }
  if(st.acc==='bag'){
    const lag=o.bagLag||0;
    c.save();
    c.translate(px-u.x*4-14, py+u.y*(SK.TORSO*0.55)+lag);
    c.rotate(P.lean*0.5);
    c.fillStyle='#2f6fd6'; rr(c,-11,-15,21,29,6); c.fill();
    c.fillStyle='#5b93e8'; rr(c,-11,-15,21,8,6); c.fill();
    c.strokeStyle='#1d4ea3';c.lineWidth=2;rr(c,-11,-15,21,29,6);c.stroke();
    c.restore();
    c.strokeStyle='#2f6fd6';c.lineWidth=4;
    c.beginPath();c.moveTo(sh.x+2,sh.y-2);c.lineTo(px-u.x*4-6,py+u.y*14);c.stroke();
  }
  c.strokeStyle=st.top;c.lineWidth=SK.TORSOW;c.lineCap='round';
  c.beginPath();c.moveTo(px,py+2);c.lineTo(neck.x,neck.y+3);c.stroke();
  c.strokeStyle=st.trim;c.lineWidth=SK.TORSOW-4;c.lineCap='butt';
  const hemA={x:px+u.x*2,y:py+u.y*2+2}, hemB={x:px+u.x*6,y:py+u.y*6+2};
  c.beginPath();c.moveTo(hemA.x,hemA.y);c.lineTo(hemB.x,hemB.y);c.stroke();
  c.beginPath();c.moveTo(neck.x-u.x*2,neck.y-u.y*2+3);c.lineTo(neck.x+u.x*1,neck.y+u.y*1+3);c.stroke();
  if(st.acc==='tie'){
    c.fillStyle='#f5f5f3';
    c.beginPath();
    c.moveTo(neck.x+6,neck.y+5);c.lineTo(neck.x+1,neck.y+18);c.lineTo(neck.x+11,neck.y+9);c.closePath();c.fill();
    const wav=Math.sin((o.t||0)*11)*4;
    c.fillStyle='#243150';
    c.beginPath();
    c.moveTo(neck.x+6,neck.y+6);
    c.quadraticCurveTo(neck.x-2+wav*0.4, neck.y+16, neck.x-6+wav, neck.y+24);
    c.lineTo(neck.x-1+wav, neck.y+26);
    c.quadraticCurveTo(neck.x+5, neck.y+16, neck.x+9, neck.y+8);
    c.closePath();c.fill();
  }
  {
    c.fillStyle=st.hair;
    c.beginPath();c.arc(hc.x-4,hc.y-3,SK.HEADR+0.5,0,TAU);c.fill();
    c.fillStyle=st.skin;
    c.beginPath();c.arc(hc.x+4.5,hc.y+3,SK.HEADR-1,0,TAU);c.fill();

function waveH(cdef,x){
  if(!cdef.wave)return 0;
  const w=cdef.wave;
  return Math.sin(x*w[1])*w[0]+Math.sin(x*w[3]+1.7)*w[2];
}

function speedTable(s0,len){
  const tbl=[]; let x=0,t=0;
  while(x<=len+2000){ tbl.push({x,s:s0*(1+Math.min(0.25,0.004*t))}); const s=s0*(1+Math.min(0.25,0.004*t)); x+=s*0.25; t+=0.25; }
  return x2=>{ for(let i=tbl.length-1;i>=0;i--){ if(tbl[i].x<=x2)return tbl[i].s; } return s0; };
}

function genCourse(ci,diffKey){
  const cdef=COURSES[ci], D=DIFF[diffKey];
  const s0=cdef.baseSpeed*D.speedMul;
  const len=cdef.length[diffKey];
  const spd=speedTable(s0,len);
  const rng=mulberry32(hashStr(cdef.id+':'+diffKey));
  const KS=KINDSET[cdef.id];
  const ents=[];
  const pick=(arr)=>arr[Math.floor(rng()*arr.length)];
  const wH=x=>waveH(cdef,x);
  const ob=(x,h,w,kinds)=>({t:'ob',kind:Array.isArray(kinds)?pick(kinds):kinds,x,w:w||44,h,minClear:1/0,done:false,hitMe:false,seed:rng()});
  const coin=(x,y)=>({t:'coin',x,y:GROUND-wH(x)-y,got:false,seed:rng()});
  const arc=(x,y0,n,dx,amp)=>{const a=[];for(let i=0;i<n;i++){const u2=i/(n-1);a.push(coin(x+i*dx, y0+Math.sin(u2*Math.PI)*amp));}return a;};
  const after=s=>Math.max(280,0.5*s);

  const GENS={
    breather:(s,x)=>({len:340+rng()*240, ents: rng()<0.4?[coin(x+120,70),coin(x+170,70),coin(x+220,70)]:[]}),
    single_low:(s,x)=>({len:240+44+after(s), ents:[ob(x+240, 36+rng()*10, 44, KS.low)]}),
    single_mid:(s,x)=>({len:240+44+Math.max(300,0.55*s), ents:[ob(x+240, 58+rng()*8, 44, KS.mid)]}),
    single_tall:(s,x)=>({len:260+48+Math.max(330,0.6*s), ents:[ob(x+260, 100, 48, KS.tall)]}),
    wide:(s,x)=>({len:240+116+Math.max(330,0.6*s), ents:[ob(x+240, 40, 116, KS.wide)]}),
    double:(s,x)=>{const gap=jd(s)+150;return {len:240+gap+44+Math.max(300,0.55*s),
      ents:[ob(x+240,38+rng()*8,44,KS.low),ob(x+240+gap,38+rng()*8,44,KS.low)]};},
    triple:(s,x)=>{const gap=jd(s)+150;return {len:240+gap*2+44+Math.max(300,0.55*s),
      ents:[ob(x+240,38,44,KS.low),ob(x+240+gap,38,44,KS.low),ob(x+240+gap*2,38,44,KS.low)]};},
    coin_arc:(s,x)=>{const h=40;return {len:240+44+Math.max(300,0.55*s),
      ents:[ob(x+240,h,44,KS.low), ...arc(x+150,h+36,7,32,68)]};},
    coin_line:(s,x)=>({len:560, ents:[coin(x+120,64),coin(x+170,64),coin(x+220,64),coin(x+270,64),coin(x+320,64)]}),
    coin_sky:(s,x)=>({len:620, ents:arc(x+140,120,7,38,96)}), // 二段ジャンプで届く高さ
    bar:(s,x)=>({len:240+96+Math.max(0.45*s,280), ents:[{t:'bar',x:x+240,w:96,yb:64,kind:KS.bar,done:false,hitMe:false,minClear:1/0,seed:rng()}]}),
    bar_double:(s,x)=>{const gap=Math.max(0.55*s,300);return {len:240+gap+96+Math.max(0.45*s,280),
      ents:[{t:'bar',x:x+240,w:96,yb:64,kind:KS.bar,done:false,hitMe:false,minClear:1/0,seed:rng()},
            {t:'bar',x:x+240+gap,w:96,yb:64,kind:KS.bar,done:false,hitMe:false,minClear:1/0,seed:rng()}]};},
    pit:(s,x)=>{const w=(0.32+rng()*0.10)*s*D.pitMul;return {len:240+w+Math.max(0.5*s,300),
      ents:[{t:'pit',x:x+240,w}]};},
    pit_double:(s,x)=>{const w=Math.min((0.55+rng()*0.08)*s*D.pitMul,0.8*s);return {len:260+w+Math.max(0.55*s,320),

    plat_pit:(s,x)=>{const w=Math.min(0.95*s*D.pitMul,1.25*s);const pw=110;

    rhythm3:(s,x)=>{const gap=0.70*s;return {len:200+gap*2+44+Math.max(0.5*s,300),

    rhythm7:(s,x)=>{const gap=0.70*s;return {len:200+gap*6+44+Math.max(0.5*s,300),

    c.fillStyle='#d8372e';
    const fl=Math.sin(t*4+i)*6;
    c.beginPath();c.moveTo(bx,322);c.quadraticCurveTo(bx+30,326+fl,bx+58,322+fl);
    c.lineTo(bx+58,344+fl);c.quadraticCurveTo(bx+30,348+fl,bx,344);c.closePath();c.fill();
  }
},
};

// 地面スタイル
const GROUND_STYLE={
  station:{base:'#d9d4cb',edge:'#cfc9bf',deco:'tactile'},
  osu:{base:'#c8b9a2',edge:'#b9a98f',deco:'brick'},
  hisaya:{base:'#dcd6c4',edge:'#cdc7b2',deco:'lawn'},
  oasis:{base:'#aed4dc',edge:'#92bcc6',deco:'glass'},
  castle:{base:'#b9bcb4',edge:'#a3a69c',deco:'slab'},
  atsuta:{base:'#d2cbb4',edge:'#c2bba2',deco:'gravel'},
  aquarium:{base:'#4a9cc4',edge:'#3a87ae',deco:'water'},
  higashiyama:{base:'#c6b292',edge:'#b5a17e',deco:'dirt'},
  igarena:{base:'#9a9aac',edge:'#88889a',deco:'plaza'},
};
function drawGround(c,R){
  const st=GROUND_STYLE[R.course.bg], cam=R.dist;
  if(R.course.wave){
    // 波面（水/ガラス曲面）
    c.fillStyle=st.base;
    c.beginPath(); c.moveTo(0,H);
    for(let x=0;x<=W;x+=12){
      c.lineTo(x, GROUND-waveH(R.course,cam+x));
    }
    c.lineTo(W,H); c.closePath(); c.fill();
    c.strokeStyle=st.deco==='water'?'rgba(255,255,255,0.7)':'rgba(255,255,255,0.85)';
    c.lineWidth=3;
    c.beginPath();
    for(let x=0;x<=W;x+=12){
      const y=GROUND-waveH(R.course,cam+x);
      x===0?c.moveTo(x,y):c.lineTo(x,y);
    }
    c.stroke();
    if(st.deco==='water'){
      c.fillStyle='rgba(255,255,255,0.25)';
      for(let i=0;i<8;i++){
        const wx2=((i*149+R.time*46)%(W+40))-20;
        c.fillRect(wx2,GROUND-waveH(R.course,cam+wx2)+14+(i*23)%40,30,3);
      }
    }else{
      c.strokeStyle='rgba(255,255,255,0.3)';c.lineWidth=1.5;
      const gx=((-cam%90)+90)%90;
      for(let x=-90;x<W+90;x+=90){
        c.beginPath();c.moveTo(x+gx,GROUND-waveH(R.course,cam+x+gx)+4);c.lineTo(x+gx-14,H-20);c.stroke();
      }
    }
    const wg=c.createLinearGradient(0,GROUND,0,H);
    wg.addColorStop(0,'rgba(0,0,0,0)'); wg.addColorStop(1,'rgba(0,10,30,0.22)');
    c.fillStyle=wg; c.fillRect(0,GROUND-46,W,H-GROUND+46);
    return;
  }
  // 平地＋ピット
  const pits=R.pits.filter(e=>e.x<cam+W+50&&e.x+e.w>cam-50);
  let segs=[[0,W]];
  pits.forEach(p2=>{
    const l=p2.x-cam, r2=p2.x+p2.w-cam, ns=[];
    segs.forEach(([a,b])=>{
      if(r2<=a||l>=b){ns.push([a,b]);return;}
      if(l>a)ns.push([a,l]);
      if(r2<b)ns.push([r2,b]);
    });
    segs=ns;
  });
  c.fillStyle=st.base;
  segs.forEach(([a,b])=>c.fillRect(a,GROUND,b-a,H-GROUND));
  const gg=c.createLinearGradient(0,GROUND,0,H);
  gg.addColorStop(0,'rgba(255,255,255,0.10)');
  gg.addColorStop(0.22,'rgba(0,0,0,0)');
  gg.addColorStop(1,'rgba(10,8,20,0.20)');
  segs.forEach(([a,b])=>{c.fillStyle=gg;c.fillRect(a,GROUND,b-a,H-GROUND);});
  c.fillStyle=st.edge;
  segs.forEach(([a,b])=>c.fillRect(a,GROUND,b-a,5));
  // ピット内壁
  pits.forEach(p2=>{
    const l=p2.x-cam, w2=p2.w;
    c.fillStyle='#1f1d22'; c.fillRect(l,GROUND,w2,H-GROUND);
    c.fillStyle='rgba(255,255,255,0.10)';
    c.fillRect(l,GROUND,5,H-GROUND); c.fillRect(l+w2-5,GROUND,5,H-GROUND);
    if(st.deco==='slab'){ // 堀の水
      c.fillStyle='#3a5a78'; c.fillRect(l,GROUND+46,w2,H-GROUND-46);
      c.fillStyle='rgba(255,255,255,0.25)';
      c.fillRect(l+6,GROUND+50,Math.max(0,w2-12),3);
    }
  });
  // 装飾
  const gx=((-cam%64)+64)%64;
  const inSeg=x=>segs.some(([a,b])=>x>=a&&x+40<=b);
  if(st.deco==='tactile'){
    c.fillStyle='#e8c93e';
    for(let x=-64;x<W+64;x+=64){ if(inSeg(x+gx))c.fillRect(x+gx,GROUND+12,40,9); }
    c.fillStyle='#f5f3ee';
    segs.forEach(([a,b])=>c.fillRect(a,GROUND+4,b-a,4));
  }else if(st.deco==='brick'){
    c.strokeStyle='rgba(120,90,60,0.35)';c.lineWidth=2;
    for(let x=-64;x<W+64;x+=64){ if(inSeg(x+gx)){c.strokeRect(x+gx,GROUND+10,32,14);c.strokeRect(x+gx+32,GROUND+24,32,14);} }
  }else if(st.deco==='lawn'){
    c.fillStyle='#8cc07a';
    segs.forEach(([a,b])=>c.fillRect(a,GROUND,b-a,9));
  }else if(st.deco==='slab'){
    c.strokeStyle='rgba(90,95,90,0.4)';c.lineWidth=2;
    for(let x=-96;x<W+96;x+=96){ const xx=x+((-cam%96)+96)%96; if(inSeg(xx)){c.beginPath();c.moveTo(xx,GROUND);c.lineTo(xx,H);c.stroke();} }
  }else if(st.deco==='gravel'){
    c.fillStyle='rgba(120,110,80,0.4)';
    for(let i=0;i<40;i++){
      const xx=((i*53-cam)% (W+40)+(W+40))%(W+40)-20;
      if(inSeg(xx))c.fillRect(xx,GROUND+14+(i*29)%44,4,3);
    }
  }else if(st.deco==='dirt'){
    c.fillStyle='rgba(110,90,60,0.4)';
    for(let i=0;i<30;i++){
      const xx=((i*67-cam)%(W+40)+(W+40))%(W+40)-20;
      if(inSeg(xx))c.fillRect(xx,GROUND+12+(i*31)%48,7,4);
    }
  }else if(st.deco==='plaza'){
    c.strokeStyle='rgba(60,60,80,0.4)';c.lineWidth=2;
    for(let x=-80;x<W+80;x+=80){ const xx=x+((-cam%80)+80)%80; if(inSeg(xx)){c.beginPath();c.moveTo(xx,GROUND);c.lineTo(xx,H);c.stroke();} }
    c.fillStyle='rgba(140,220,255,0.5)';
    segs.forEach(([a,b])=>c.fillRect(a,GROUND+7,b-a,3));
  }
}

    c.fillStyle='#b06a28';

    c.beginPath();c.moveTo(4,-10);c.lineTo(10,-22);c.stroke();

    c.fillStyle='#f7e7a8';c.font='bold 11px '+TXT_FONT;c.textAlign='center';c.fillText('守',0,6);
  }else if(kind==='fish'){
    c.fillStyle='#4a90c8';
    c.beginPath();c.ellipse(-2,0,13,7,0,0,TAU);c.fill();
    c.beginPath();c.moveTo(9,0);c.lineTo(17,-7);c.lineTo(17,7);c.closePath();c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(-8,-2,2,0,TAU);c.fill();
  }else if(kind==='acorn'){

    c.fillStyle='#6e4a22';c.beginPath();c.arc(0,-5,10,Math.PI,TAU);c.fill();

function drawEnt(c,e,sx,t,gy,R){
  if(e.t==='coin'){
    if(e.got)return;
    const w=Math.abs(Math.cos(t*4+e.x*0.01));
    c.save();c.translate(sx,e.y);
    c.fillStyle='#e8b421';c.beginPath();c.ellipse(0,0,11*Math.max(w,0.25),11,0,0,TAU);c.fill();
    c.fillStyle='#f7d45e';c.beginPath();c.ellipse(0,0,7*Math.max(w,0.25),7,0,0,TAU);c.fill();
    c.restore(); return;
  }
  if(e.t==='item'){
    if(e.got)return;
    const fy=e.y+Math.sin(t*3+e.x)*5;
    c.save();c.translate(sx,fy);
    c.fillStyle='rgba(255,244,180,0.4)';c.beginPath();c.arc(0,0,24,0,TAU);c.fill();
    drawItemIcon(c,R.course.item);
    c.restore(); return;
  }
  if(e.t==='plat'){
    const py=gy-e.h;
    c.save();
    if(e.kind==='stonePlat'){
      c.fillStyle='#9aa2a6'; rr(c,sx,py,e.w,16,4); c.fill();
      c.fillStyle='#878f93'; rr(c,sx+4,py+10,e.w-8,6,2); c.fill();
      c.strokeStyle='#777f84';c.lineWidth=2;
      c.beginPath();c.moveTo(sx+e.w*0.33,py+2);c.lineTo(sx+e.w*0.33,py+13);c.moveTo(sx+e.w*0.66,py+2);c.lineTo(sx+e.w*0.66,py+13);c.stroke();
    }else{
      c.fillStyle='#b08a52'; rr(c,sx,py,e.w,15,4); c.fill();
      c.strokeStyle='#8a6a3a';c.lineWidth=2;
      for(let i=1;i<4;i++){c.beginPath();c.moveTo(sx+e.w*i/4,py+2);c.lineTo(sx+e.w*i/4,py+12);c.stroke();}
      c.strokeStyle='#7a5a30';c.lineWidth=4;
      c.beginPath();c.moveTo(sx+10,py+15);c.lineTo(sx+10,py+44);c.moveTo(sx+e.w-10,py+15);c.lineTo(sx+e.w-10,py+44);c.stroke();
    }
    c.restore(); return;
  }
  if(e.t==='bar'){
    const botY=gy-e.yb, sx2=sx;
    c.save();
    // 吊り構造
    c.strokeStyle='#7a6a55';c.lineWidth=5;
    c.beginPath();c.moveTo(sx2+10,botY-150);c.lineTo(sx2+10,botY-58);c.moveTo(sx2+e.w-10,botY-150);c.lineTo(sx2+e.w-10,botY-58);c.stroke();
    c.fillStyle='#6a5a45'; c.fillRect(sx2-8,botY-160,e.w+16,12);
    if(e.kind==='noren'){
      c.fillStyle='#28508c';
      for(let i=0;i<4;i++){
        const wx2=sx2+4+i*(e.w-8)/4, ww=(e.w-8)/4-3;
        const sw=Math.sin(t*5+i*1.3)*3;
        c.beginPath();
        c.moveTo(wx2,botY-58);c.lineTo(wx2+ww,botY-58);
        c.lineTo(wx2+ww+sw,botY);c.lineTo(wx2+sw,botY);c.closePath();c.fill();
      }
      c.fillStyle='#fff';c.font='bold 14px '+TXT_FONT;c.textAlign='center';
      c.fillText('大須',sx2+e.w/2,botY-30);
    }else if(e.kind==='beam'){
      c.fillStyle='#5a4a35'; rr(c,sx2,botY-26,e.w,26,4); c.fill();
      c.fillStyle='#4a3a28';
      c.beginPath();c.arc(sx2+14,botY-13,4,0,TAU);c.arc(sx2+e.w-14,botY-13,4,0,TAU);c.fill();
    }else{ // banner
      c.fillStyle='#d8372e'; rr(c,sx2,botY-30,e.w,30,5); c.fill();
      c.fillStyle='#fff';c.font='900 14px '+TXT_FONT;c.textAlign='center';
      c.fillText('SALE',sx2+e.w/2,botY-9);
    }
    c.restore(); return;
  }
  // 障害物（ob/mov）
  const x=sx, w=e.w, h=e.h;
  const K=e.kind;
  // 接地影
  c.save();
  c.globalAlpha=0.16;
  c.fillStyle='#000';
  c.beginPath();c.ellipse(x+w/2,gy-1,w*0.62,5.5,0,0,TAU);c.fill();
  c.restore();
  if(K==='cone'){
    c.fillStyle='#e06a2b';
    c.beginPath();c.moveTo(x+w/2,gy-h);c.lineTo(x+w-4,gy);c.lineTo(x+4,gy);c.closePath();c.fill();
    c.fillStyle='#fff';
    c.beginPath();c.moveTo(x+w/2-5,gy-h*0.55);c.lineTo(x+w/2+5,gy-h*0.55);c.lineTo(x+w/2+8,gy-h*0.3);c.lineTo(x+w/2-8,gy-h*0.3);c.closePath();c.fill();
    c.fillStyle='#c2541d';c.fillRect(x,gy-4,w,4);
  }else if(K==='case'){
    const col=e.seed<0.33?'#b8453a':e.seed<0.66?'#2f5e8f':'#3c7a52';
    c.fillStyle=shade(col,0.8); rr(c,x,gy-h,w,h,6); c.fill();
    c.fillStyle=col; rr(c,x+2,gy-h+2,w-4,h-8,5); c.fill();
    c.strokeStyle=shade(col,0.7);c.lineWidth=2;
    c.beginPath();c.moveTo(x+w*0.35,gy-h+2);c.lineTo(x+w*0.35,gy-6);c.moveTo(x+w*0.65,gy-h+2);c.lineTo(x+w*0.65,gy-6);c.stroke();
    c.strokeStyle=shade(col,0.65);c.lineWidth=3;
    rr(c,x+w*0.3,gy-h-7,w*0.4,9,3);c.stroke();
    c.fillStyle='#2c2c30';
    c.beginPath();c.arc(x+8,gy-2,3.4,0,TAU);c.arc(x+w-8,gy-2,3.4,0,TAU);c.fill();
  }else if(K==='board'){
    c.fillStyle='#f5f2ea';
    c.beginPath();c.moveTo(x+w/2,gy-h);c.lineTo(x+w,gy);c.lineTo(x+w-10,gy);c.lineTo(x+w/2,gy-h+8);c.closePath();c.fill();
    c.fillStyle='#fff'; c.beginPath();
    c.moveTo(x+w/2,gy-h);c.lineTo(x+w*0.05,gy);c.lineTo(x+w*0.8,gy);c.closePath();c.fill();
    c.fillStyle='#d8372e';c.font='bold 16px '+TXT_FONT;c.textAlign='center';
    c.save();c.translate(x+w*0.42,gy-h*0.45);c.rotate(0.06);c.fillText('→',0,0);c.restore();
    c.fillStyle='#9b958a';c.fillRect(x,gy-3,w,3);
  }else if(K==='caseRow'){
    const cols=['#b8453a','#2f5e8f','#3c7a52'];
    for(let i=0;i<3;i++){
      const cw2=w/3-4, cx2=x+i*(w/3), ch2=h-(i%2)*5, cgy=gy;
      const col=cols[i%3];
      c.fillStyle=shade(col,0.78); rr(c,cx2,cgy-ch2,cw2,ch2,5); c.fill();
      const g=c.createLinearGradient(cx2,cgy-ch2,cx2+cw2,cgy);
      g.addColorStop(0,shade(col,1.18)); g.addColorStop(1,col);
      c.fillStyle=g; rr(c,cx2+1.5,cgy-ch2+1.5,cw2-3,ch2-6,4); c.fill();
      c.strokeStyle=shade(col,0.62);c.lineWidth=1.8;
      c.beginPath();c.moveTo(cx2+cw2*0.5,cgy-ch2+2);c.lineTo(cx2+cw2*0.5,cgy-4);c.stroke();
      c.strokeStyle=shade(col,0.6);c.lineWidth=2.5;
      rr(c,cx2+cw2*0.3,cgy-ch2-6,cw2*0.4,8,3);c.stroke();
      c.fillStyle='#2c2c30';
      c.beginPath();c.arc(cx2+6,cgy-2,3,0,TAU);c.arc(cx2+cw2-6,cgy-2,3,0,TAU);c.fill();
    }
  }else if(K==='stoneRow'){
    const cols=['#9aa2a6','#878f93','#a8b0b4'];
    for(let i=0;i<3;i++){
      c.fillStyle=cols[i%3];
      c.beginPath();c.ellipse(x+(i+0.5)*(w/3),gy-h*0.45-(i%2)*4,w/6+2,h*0.5,0,0,TAU);c.fill();
      c.fillStyle='rgba(255,255,255,0.18)';
      c.beginPath();c.ellipse(x+(i+0.5)*(w/3)-3,gy-h*0.6-(i%2)*4,w/10,h*0.2,0,0,TAU);c.fill();
    }
  }else if(K==='stack'){
    c.fillStyle='#7d8893'; c.fillRect(x-2,gy-10,w+4,4);
    c.fillStyle='#2c2c30';
    c.beginPath();c.arc(x+8,gy-3,4,0,TAU);c.arc(x+w-8,gy-3,4,0,TAU);c.fill();
    const rows=Math.ceil((h-10)/32);
    for(let i=0;i<rows;i++){
      const bh=Math.min(32,h-10-i*32);
      const col=i%2?'#c89a62':'#b8895a';
      c.fillStyle=col; rr(c,x+(i%2?3:-3),gy-10-(i*32)-bh,w,bh,3); c.fill();
      c.strokeStyle='#a3753f';c.lineWidth=2;
      c.beginPath();c.moveTo(x+w/2+(i%2?3:-3),gy-10-(i*32)-bh);c.lineTo(x+w/2+(i%2?3:-3),gy-10-(i*32));c.stroke();
    }
  }else if(K==='yatai'){
    c.fillStyle='#8a6a3a'; rr(c,x,gy-h,w,h,4); c.fill();
    c.fillStyle='#6e5230'; c.fillRect(x,gy-h,w,7);
    c.fillStyle='#e05545';
    c.beginPath();c.ellipse(x+w/2,gy-h+3,8,10,0,0,TAU);c.fill();
    c.fillStyle='#2c2c30';
    c.beginPath();c.arc(x+9,gy-3,4,0,TAU);c.arc(x+w-9,gy-3,4,0,TAU);c.fill();
  }else if(K==='maneki'){
    c.fillStyle='#f5f2ec';
    c.beginPath();c.ellipse(x+w/2,gy-h*0.4,w*0.42,h*0.4,0,0,TAU);c.fill();

// ---------- パーティクル＆ポップアップ ----------
let parts=[], pops=[];
function dust(x,y,n,col){
  for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-0.5)*16,y:y-Math.random()*6,
    vx:-60-Math.random()*90,vy:-30-Math.random()*60,life:0.4+Math.random()*0.3,t:0,r:3+Math.random()*3,col:col||'#cfc9bb'});
}
function confetti(){
  for(let i=0;i<90;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*200,
    vx:(Math.random()-0.5)*60,vy:120+Math.random()*120,life:2.4+Math.random()*1.5,t:0,r:3+Math.random()*4,
    col:['#d8372e','#e8b421','#2f6fd6','#3aa15c','#e06a9d'][i%5],conf:true});
}
function pop(x,y,txt,col,size){
  pops.push({x,y,txt,col:col||'#d8372e',size:size||22,t:0,life:0.9});
}
function perfectBurst(x,y){
  parts.push({x,y,vx:0,vy:0,ring:true,life:0.38,t:0,r:8,col:'rgba(216,55,46,'});
  for(let i=0;i<6;i++)parts.push({x,y,vx:Math.cos(i/6*TAU)*130,vy:Math.sin(i/6*TAU)*130-40,life:0.32,t:0,r:2.4,col:'#f0c93c'});
}
function updFx(dt){
  parts=parts.filter(p=>(p.t+=dt)<p.life);
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.conf){p.vy+=40*dt;p.vx+=Math.sin(p.t*7+p.r)*30*dt;}else p.vy+=300*dt;});
  pops=pops.filter(p=>(p.t+=dt)<p.life);
}
function drawFx(c){
  parts.forEach(p=>{
    c.globalAlpha=clamp(1-p.t/p.life,0,1);
    if(p.ring){
      const u=p.t/p.life;
      c.strokeStyle=p.col+(1-u)+')';
      c.lineWidth=3.5*(1-u)+1;
      c.beginPath();c.arc(p.x,p.y,p.r+u*50,0,TAU);c.stroke();
      return;
    }
    c.fillStyle=p.col;
    if(p.conf){c.save();c.translate(p.x,p.y);c.rotate(p.t*5+p.r);c.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2);c.restore();}
    else{c.beginPath();c.arc(p.x,p.y,p.r*(1-p.t/p.life*0.5),0,TAU);c.fill();}
  });
  c.globalAlpha=1;
  pops.forEach(p=>{
    const u=p.t/p.life;
    c.globalAlpha=u<0.7?1:1-(u-0.7)/0.3;
    c.font='900 '+p.size+'px '+TXT_FONT;c.textAlign='center';
    c.lineWidth=4;c.strokeStyle='#fff';
    c.strokeText(p.txt,p.x,p.y-u*42);
    c.fillStyle=p.col;c.fillText(p.txt,p.x,p.y-u*42);
  });
  c.globalAlpha=1;
}

// ---------- ラン状態 ----------
let RUN=null;
const PLAYER_X=240;
function startRun(courseIdx,diffKey){
  const cdef=COURSES[courseIdx];
  const gen=genCourse(courseIdx,diffKey);
  RUN={
    course:cdef, diffKey, D:DIFF[diffKey],
    ents:gen.ents.filter(e=>e.t!=='pit'&&e.t!=='plat'),
    pits:gen.ents.filter(e=>e.t==='pit'),
    plats:gen.ents.filter(e=>e.t==='plat'),
    len:gen.len, s0:gen.s0,
    dist:0, time:0, state:'ready', readyT:0, goalT:0, deadT:0, fellPit:false,
    speed:gen.s0, stumbleT:0,
    score:0, combo:0, maxCombo:0, perfects:0, coins:0, items:0,
    hp:DIFF[diffKey].hp,
    p:{y:0,vy:0,grounded:true,jumps:0,coyote:0,holdT:0,sliding:false,slideMin:0,slideStart:-1e9,takeoff:undefined,
       phase:0, spinT:0, invuln:0, landT:9, bagY:0,bagV:0, wire:0},
    shake:0, paused:false, newRecord:false, goldJust:false, unlockJust:null,
    freeze:0, camY:0, dispScore:0, flashT:0,
  };
  parts=[];pops=[];
  G.screen='play';
}
function quickRetry(){
  if(G.screen==='play'&&RUN.state==='dead'){SFX.ui();startRun(G.courseIdx,G.diffKey);}
  else if(G.screen==='clear'||G.screen==='gameover'){SFX.ui();startRun(G.courseIdx,G.diffKey);}
}
function togglePause(){
  if(G.screen!=='play'||RUN.state!=='running')return;
  RUN.paused=!RUN.paused; SFX.ui();
}
function mult(){ return 1+0.1*Math.min(RUN.combo,20); }

// 面モデル：worldX における立てる面の高さ（基準地面=0、なし=-1e9）
function surfaceAt(R,x,yRef){
  let s=-1e9;
  if(R.course.wave){ s=waveH(R.course,x); }
  else{
    let overPit=false;
    for(const e of R.pits){ if(x>e.x&&x<e.x+e.w){overPit=true;break;} }
    if(!overPit)s=0;
  }
  for(const e of R.plats){
    if(x>=e.x-10&&x<=e.x+e.w+10){ if(e.h<=yRef+15&&e.h>s)s=e.h; }
  }
  return s;
}
function playerBox(){
  const p=RUN.p, x=PLAYER_X, base=GROUND-p.y;
  if(p.sliding) return {l:x-22,r:x+26,t:base-46,b:base-2};
  if(!p.grounded) return {l:x-15,r:x+15,t:base-96,b:base-16};
  return {l:x-15,r:x+15,t:base-102,b:base-2};
}
function hitPlayer(){
  const R=RUN;
  R.hp--; R.combo=0; R.p.invuln=1.2; R.shake=0.35; R.stumbleT=0.45;
  R.freeze=0.085; R.flashT=0.12;
  SFX.hit(); pop(PLAYER_X,GROUND-RUN.p.y-130,'いてっ','#444',20);
  dust(PLAYER_X,GROUND-RUN.p.y,8,'#b9b2a4');
  if(R.hp<=0){ R.state='dead'; R.deadT=0; SFX.dead(); }
}
function fallDeath(){
  const R=RUN;
  R.state='dead'; R.deadT=0; R.fellPit=true; SFX.fall();
}

function updatePlay(dt){
  const R=RUN; if(!R||R.paused)return;
  if(R.freeze>0){ R.freeze-=dt; return; } // ヒットストップ
  const p=R.p;
  R.time+=dt;
  R.camY*=Math.exp(-dt*9);
  if(R.flashT>0)R.flashT-=dt;

  if(R.state==='ready'){
    R.readyT+=dt;
    if(R.readyT>1.4){R.state='running';SFX.go();pop(PLAYER_X,GROUND-170,'GO!','#d8372e',34);}
    p.phase+=dt*4;
    return updFx(dt);
  }
  if(R.state==='dead'){
    R.deadT+=dt;
    p.y+=p.vy*dt; p.vy-=PHYS.g*0.8*dt;
    if(!R.fellPit&&p.y<=0){p.y=0;p.vy=0;}
    if(R.deadT>1.1){ G.screen='gameover'; }
    return updFx(dt);
  }

  const ramp=1+Math.min(0.25,0.004*R.time);
  R.speed=R.s0*ramp*(R.stumbleT>0?0.55:1);
  if(R.stumbleT>0)R.stumbleT-=dt;

  if(R.state==='goal'){
    R.goalT+=dt;
    R.speed*=Math.max(0,1-R.goalT/1.1);
    R.dist+=R.speed*dt;
    p.phase+=R.speed*dt/52*0.36;
    // 地面追従
    const s=surfaceAt(R,R.dist+PLAYER_X,p.y);
    if(s>-1e8)p.y=Math.max(s,0);
    if(R.goalT>1.9){ finishClear(); }
    updFx(dt); return;
  }

  R.dist+=R.speed*dt;
  R.score+=R.speed*dt/40*mult();

  const px=R.dist+PLAYER_X;

  // --- ジャンプ／スライド ---
  IN.jumpBuf=Math.max(0,IN.jumpBuf-dt);
  if(p.grounded)p.coyote=PHYS.coyote; else p.coyote-=dt;
  if(IN.jumpBuf>0){
    if(p.grounded||p.coyote>0){
      p.vy=PHYS.jumpV; p.grounded=false; p.jumps=1; p.holdT=0; p.coyote=0; IN.jumpBuf=0;
      p.sliding=false; p.takeoff=R.dist+255; SFX.jump(); dust(PLAYER_X,GROUND-p.y,5);
    }else if(p.jumps<2){
      p.vy=PHYS.djV; p.jumps=2; p.spinT=0.0001; p.holdT=0; IN.jumpBuf=0; SFX.dj();
    }
  }
  if(!p.grounded){
    const hold=IN.jumpHeld&&p.vy>0&&p.holdT<PHYS.holdMax;
    if(hold)p.holdT+=dt;
    if(IN.slidePulse){ p.vy=Math.min(p.vy,-1050); }
    const prevY=p.y;
    p.vy-=(hold?PHYS.gHold:PHYS.g)*dt;
    p.y+=p.vy*dt;
    const sLand=surfaceAt(R,px,prevY+4);
    if(p.vy<=0&&sLand>-1e8&&prevY>=sLand-2&&p.y<=sLand){
      p.y=sLand;p.vy=0;p.grounded=true;p.jumps=0;p.spinT=0;p.landT=0;
      R.camY=4.2;
      dust(PLAYER_X,GROUND-p.y,6);
      p.sliding=IN.slideHeld;
      if(p.sliding){p.slideMin=0.3;p.slideStart=R.dist+255;}
    }
    if(p.y<-80&&R.state==='running'){ fallDeath(); return updFx(dt); }
  }else{
    const s=surfaceAt(R,px,p.y);
    if(s<p.y-15){ p.grounded=false; }
    else p.y=s;
    if(IN.slideHeld&&!p.sliding){p.sliding=true;p.slideMin=0.3;p.slideStart=R.dist+255;SFX.slide();}
    if(p.sliding){
      p.slideMin-=dt;
      if(!IN.slideHeld&&p.slideMin<=0)p.sliding=false;
      if(Math.random()<dt*22)dust(PLAYER_X-18,GROUND-p.y,1);
    }
  }
  IN.slidePulse=false;
  if(p.spinT>0){p.spinT=Math.min(1,p.spinT+dt/0.5);if(p.spinT>=1)p.spinT=0;}
  p.landT+=dt;
  if(p.invuln>0)p.invuln-=dt;
  const cyc=clamp(0.5-((R.speed/R.s0)-1)*0.25,0.34,0.52);
  if(p.grounded&&!p.sliding)p.phase+=dt/cyc*TAU/2;
  const targ=p.grounded?Math.sin(2*p.phase)*2.5:(p.vy>0?5:-5);
  p.bagV+=(targ-p.bagY)*dt*46; p.bagV*=Math.exp(-dt*7); p.bagY+=p.bagV*dt*8;
  p.bagY=clamp(p.bagY,-9,9);
  p.wire=Math.sin(R.time*9)*3+clamp(-p.vy*0.012,-7,7);

  // --- 当たり判定 ---
  const box=playerBox();
  const camL=R.dist, camR=R.dist+W;
  for(const e of R.ents){
    const baseX=e.t==='mov'? e.x+Math.sin(R.time*e.sp+e.ph)*e.range : e.x;
    if(e.x>camR+260)break;
    if(e.x<camL-360)continue;
    const surfB=R.course.wave?waveH(R.course,baseX):0;
    const gy=GROUND-surfB;
    if(e.t==='coin'||e.t==='item'){
      if(e.got)continue;
      const cx=baseX-R.dist, cy=e.y;
      const px2=PLAYER_X, py2=(box.t+box.b)/2;
      const rad=e.t==='item'?34:26;
      if((cx-px2)*(cx-px2)+(cy-py2)*(cy-py2)<rad*rad){
        e.got=true;
        if(e.t==='item'){R.items++;R.score+=300*mult();SFX.item();pop(cx,cy,R.course.itemName+'！','#e0942e',22);}
        else{R.coins++;R.score+=50*mult();SFX.coin();}
        for(let i=0;i<5;i++)parts.push({x:cx,y:cy,vx:(Math.random()-0.5)*160,vy:-Math.random()*150,life:0.4,t:0,r:2.5,col:'#e8b421'});
      }
      continue;
    }
    if(e.t==='bar'){
      const sl=baseX-R.dist, sr=sl+e.w;
      const botY=gy-e.yb, topY=botY-240;
      const overX=box.r>sl&&box.l<sr;
      if(overX){
        const clear=box.t-botY; // 正=くぐれている
        if(clear<e.minClear)e.minClear=clear;
        if(box.t<botY&&box.b>topY&&p.invuln<=0&&!e.hitMe&&R.state==='running'){
          e.hitMe=true; hitPlayer();
          if(R.state==='dead')return updFx(dt);
        }
      }
      if(!e.done&&box.l>sr){
        e.done=true;
        const lateSlide=(e.x-p.slideStart)>=0&&(e.x-p.slideStart)<=0.14*R.speed;
        if(!e.hitMe&&(lateSlide||(e.minClear>=0&&e.minClear<=14))){
          R.combo++;R.maxCombo=Math.max(R.maxCombo,R.combo);R.perfects++;
          R.score+=100*mult();SFX.perfect();
          pop(PLAYER_X+20,GROUND-p.y-150,'PERFECT','#d8372e',24);
          perfectBurst(PLAYER_X+26,GROUND-p.y-60);
        }
      }
      continue;
    }
    // ob / mov
    const sl=baseX-R.dist, sr=sl+e.w;
    const top=gy-e.h;
    const overX=box.r>sl&&box.l<sr;
    if(overX){
      const clear=top-box.b;
      if(clear<e.minClear)e.minClear=clear;
      if(clear<0&&box.b>top&&p.invuln<=0&&!e.hitMe&&R.state==='running'){
        e.hitMe=true; hitPlayer();
        if(R.state==='dead')return updFx(dt);
      }
    }
    if(!e.done&&box.l>sr){
      e.done=true;
      const lateTakeoff=p.takeoff!==undefined&&(e.x-p.takeoff)>=0&&(e.x-p.takeoff)<=0.12*R.speed;
      if(!e.hitMe&&e.minClear>=0&&(e.minClear<=20||lateTakeoff)){
        R.combo++;R.maxCombo=Math.max(R.maxCombo,R.combo);R.perfects++;
        R.score+=100*mult();SFX.perfect();
        pop(PLAYER_X+20,GROUND-p.y-150,'PERFECT','#d8372e',24);
        perfectBurst(PLAYER_X+26,GROUND-p.y-60);
      }
    }
  }

  if(R.dist>=R.len&&R.state==='running'){ R.state='goal'; R.goalT=0; SFX.clear(); confetti(); }
  if(R.shake>0)R.shake-=dt;
  updFx(dt);
}

function finishClear(){
  const R=RUN;
  const cs=courseSave(R.course.id);
  cs.cleared[R.diffKey]=true;
  const sc=Math.floor(R.score);
  if(sc>cs.hi){cs.hi=sc;R.newRecord=true;}
  cs.bestCombo=Math.max(cs.bestCombo,R.maxCombo);
  if(!save.gallery.includes(R.course.id))save.gallery.push(R.course.id);
  const sub=TRIVIA[R.course.id].sub;
  if(sub&&!save.gallery.includes(sub.id))save.gallery.push(sub.id);
  if(R.course.no>=save.unlockedNo&&R.course.no<COURSES.length){
    save.unlockedNo=R.course.no+1;
    R.unlockJust=COURSES[R.course.no].name;
  }
  if(!save.goldUnlocked){
    const all=COURSES.every(co=>{
      const s2=save.courses[co.id];
      return s2&&s2.cleared.easy&&s2.cleared.normal&&s2.cleared.hard;
    });
    if(all){save.goldUnlocked=true;R.goldJust=true;SFX.fanfare();}
  }
  persist();
  G.screen='clear';
}

  c.font='13px '+TXT_FONT;c.fillStyle='#8c887e';
  c.fillText('名古屋の名所をめぐってクリアし、豆知識カードを集めよう',W/2,72);
  BTNS=[];
  const nodes=COURSES.length;
  const x0=90,x1=W-90, yLine=150;
  c.strokeStyle='#d8372e';c.lineWidth=7;c.lineCap='round';
  c.beginPath();c.moveTo(x0,yLine);
  for(let i=1;i<nodes;i++){
    const x=lerp(x0,x1,i/(nodes-1));
    const y=yLine+(i%2?42:0);
    c.lineTo(x,y);
  }
  c.stroke();
  COURSES.forEach((co,i)=>{
    const x=lerp(x0,x1,i/(nodes-1));
    const y=yLine+(i%2?42:0);
    const open=co.no<=save.unlockedNo;
    const cs=save.courses[co.id];
    const anyClear=cs&&(cs.cleared.easy||cs.cleared.normal||cs.cleared.hard);
    const allClear=cs&&cs.cleared.easy&&cs.cleared.normal&&cs.cleared.hard;
    c.fillStyle='#fff';
    c.beginPath();c.arc(x,y,16,0,TAU);c.fill();
    c.lineWidth=4.5;c.strokeStyle=open?(allClear?'#e0a818':'#d8372e'):'#b9b4aa';
    c.beginPath();c.arc(x,y,16,0,TAU);c.stroke();
    if(anyClear){
      c.fillStyle='#e0a818';
      c.save();c.translate(x,y);
      c.beginPath();c.moveTo(-7,6);c.quadraticCurveTo(-2,-9,8,-7);c.quadraticCurveTo(3,-2,5,7);c.quadraticCurveTo(-1,3,-7,6);c.closePath();c.fill();
      c.restore();
    }else if(!open){
      c.fillStyle='#b9b4aa';c.font='bold 14px '+TXT_FONT;c.textAlign='center';c.fillText('🔒',x,y+5);
    }else{
      c.fillStyle='#d8372e';c.beginPath();c.arc(x,y,6,0,TAU);c.fill();
    }
    c.fillStyle=open?'#1c1c1e':'#a39e94';
    c.font=(open?'bold ':'')+'12px '+TXT_FONT;c.textAlign='center';
    c.fillText(co.name,x,y+(i%2?40:-28));
    BTNS.push({x:x-22,y:y-22,w:44,h:44,id:'course:'+i});
  });
  const co=COURSES[G.courseIdx];
  const cs=save.courses[co.id];
  c.fillStyle='rgba(255,255,255,0.85)'; rr(c,W/2-340,250,680,160,16); c.fill();
  c.fillStyle='#d8372e';c.font='900 15px '+TXT_FONT;c.textAlign='left';
  c.fillText('COURSE '+co.no,W/2-310,284);
  c.fillStyle='#1c1c1e';c.font='900 26px '+TXT_FONT;
  c.fillText(co.name+'（'+co.sub+'）',W/2-310,318);
  c.fillStyle='#6c6a64';c.font='15px '+TXT_FONT;
  c.fillText('メカニクス：'+co.mechanic+'　／　名物：'+co.itemName,W/2-310,348);
  if(cs){
    c.fillStyle='#8c887e';c.font='13px '+TXT_FONT;
    const marks=DIFF_KEYS.map(k=>DIFF[k].label+(cs.cleared[k]?'✓':'—')).join('　');
    c.fillText('クリア状況：'+marks+'　／　ハイスコア：'+cs.hi,W/2-310,378);
  }else{
    c.fillStyle='#8c887e';c.font='13px '+TXT_FONT;
    c.fillText('クリア状況：未挑戦',W/2-310,378);
  }
  btn(c,W/2+110,440,220,52,'難易度をえらぶ',{id:'go',fs:18});
  btn(c,W/2-330,440,160,52,'もどる',{id:'back',ghost:true});
  if(save.gallery.length>0)btn(c,W/2-140,440,160,52,'ギャラリー',{id:'gallery',ghost:true,fs:15});
  let act=clickedBtn();
  if(kb.confirm){act='go';kb.confirm=false;}
  if(act){
    if(act.startsWith&&act.startsWith('course:')){
      const i=+act.slice(7);
      if(COURSES[i].no<=save.unlockedNo){G.courseIdx=i;SFX.ui();}
      else {SFX.hit();pop(W/2,230,'前のコースをクリアで解放！','#8c887e',16);}
    }
    else if(act==='go'){SFX.ui();G.screen='diffsel';}
    else if(act==='back'){SFX.ui();G.screen='charsel';}
    else if(act==='gallery'){SFX.ui();G.galleryFrom='coursesel';G.screen='gallery';}
  }
}

function drawDiffsel(c){
  uiBg(c);
  const co=COURSES[G.courseIdx];
  c.fillStyle='#1c1c1e';c.font='900 28px '+TXT_FONT;c.textAlign='center';
  c.fillText(co.name+' — 難易度をえらぶ',W/2,52);
  BTNS=[];
  const cs=save.courses[co.id];
  DIFF_KEYS.forEach((k,i)=>{
    const D=DIFF[k];
    const x=W/2-330+i*230, y=100, w2=210, h2=270;
    const sel=G.diffKey===k;
    c.fillStyle=sel?'#fff':'rgba(255,255,255,0.62)';
    rr(c,x,y,w2,h2,16);c.fill();
    if(sel){c.strokeStyle=D.col;c.lineWidth=3.5;rr(c,x,y,w2,h2,16);c.stroke();}
    c.fillStyle=D.col;c.font='900 24px '+TXT_FONT;c.textAlign='center';
    c.fillText(D.label,x+w2/2,y+46);
    c.fillStyle='#6c6a64';c.font='13px '+TXT_FONT;
    c.fillText(D.desc,x+w2/2,y+76);
    for(let hh=0;hh<D.hp;hh++){
      heart(c,x+w2/2+(hh-(D.hp-1)/2)*26,y+106,10,'#d8372e');
    }
    c.fillStyle='#8c887e';c.font='12px '+TXT_FONT;
    c.fillText('はやさ ×'+D.speedMul.toFixed(2),x+w2/2,y+152);
    if(cs&&cs.cleared[k]){
      c.fillStyle='#e0a818';c.font='900 15px '+TXT_FONT;
      c.fillText('★クリアずみ',x+w2/2,y+184);
    }
    c.fillStyle='#aaa49a';c.font='12px '+TXT_FONT;
    c.fillText(cs?('ハイスコア '+cs.hi):'',x+w2/2,y+212);
    BTNS.push({x,y,w:w2,h:h2,id:'diff:'+k});
  });
  btn(c,W/2+110,430,220,56,'スタート！',{id:'start',fs:21});
  btn(c,W/2-330,430,160,56,'もどる',{id:'back',ghost:true});
  let act=clickedBtn();
  if(kb.confirm){act='start';kb.confirm=false;}
  if(act){
    if(act.startsWith&&act.startsWith('diff:')){G.diffKey=act.slice(5);SFX.ui();}
    else if(act==='start'){SFX.ui();startRun(G.courseIdx,G.diffKey);}
    else if(act==='back'){SFX.ui();G.screen='coursesel';}
  }
}

function drawPauseOverlay(c){
  c.fillStyle='rgba(20,20,24,0.55)';c.fillRect(0,0,W,H);
  c.fillStyle='#fff';c.font='900 34px '+TXT_FONT;c.textAlign='center';
  c.fillText('ポーズ',W/2,170);
  BTNS=[];
  btn(c,W/2-120,210,240,50,'つづける',{id:'resume'});

  btn(c,W/2-120,334,240,50,'コース選択へ',{id:'quit',ghost:true});
  btn(c,W/2-120,396,240,46,'サウンド：'+(save.sfx?'ON':'OFF'),{id:'sound',ghost:true,fs:16});
  const id=clickedBtn();
  if(id==='resume'){RUN.paused=false;SFX.ui();}
  if(id==='retry'){SFX.ui();startRun(G.courseIdx,G.diffKey);}
  if(id==='quit'){SFX.ui();G.screen='coursesel';}
  if(id==='sound'){save.sfx=!save.sfx;persist();SFX.ui();}
}

function wrapText(c,text,x,y,maxW,lh){
  const noHead='。、」』！？・ー）」';
  let line='',yy=y;
  for(const ch of text){
    if(c.measureText(line+ch).width>maxW && !noHead.includes(ch)){c.fillText(line,x,yy);line=ch;yy+=lh;}
    else line+=ch;
  }
  if(line)c.fillText(line,x,yy);
}

function drawClear(c){
  const R=RUN;
  BGS[R.course.bg](c,R.dist,G.t);
  drawGround(c,R);
  c.fillStyle='rgba(20,20,24,0.45)';c.fillRect(0,0,W,H);
  updFx(1/120); drawFx(c);
  const tv=TRIVIA[R.course.id];
  const hasSub=!!tv.sub;
  c.fillStyle='#fffdf8'; rr(c,W/2-360,30,720,hasSub?302:240,18); c.fill();
  c.strokeStyle='#e0a818';c.lineWidth=3; rr(c,W/2-352,38,704,hasSub?286:224,14); c.stroke();
  c.fillStyle='#d8372e';c.font='900 26px '+TXT_FONT;c.textAlign='center';
  c.fillText('COURSE CLEAR！',W/2,76);
  c.fillStyle='#1c1c1e';c.font='900 20px '+TXT_FONT;
  c.fillText('豆知識カード：'+R.course.name,W/2,112);
  c.font='15px '+TXT_FONT;c.fillStyle='#3a3a3c';c.textAlign='left';
  wrapText(c,tv.main,W/2-310,142,620,23);
  if(hasSub){
    c.fillStyle='#f3efe5'; rr(c,W/2-310,232,620,84,10); c.fill();
    c.fillStyle='#a3690f';c.font='bold 13px '+TXT_FONT;
    c.fillText('🔍 '+tv.sub.title,W/2-296,254);
    c.font='12px '+TXT_FONT;c.fillStyle='#5c594f';
    wrapText(c,tv.sub.text,W/2-296,274,592,16);
  }
  c.fillStyle='rgba(255,255,255,0.9)'; rr(c,W/2-360,hasSub?344:284,720,62,14); c.fill();
  c.fillStyle='#1c1c1e';c.font='bold 15px '+TXT_FONT;c.textAlign='center';
  const sy=hasSub?370:310;
  const stat='スコア '+Math.floor(R.score)+'　／　最大コンボ '+R.maxCombo+'　／　PERFECT '+R.perfects+'　／　'+R.course.itemName+' '+R.items+'/3';
  c.fillText(stat,W/2,sy);
  let msg='';
  if(R.goldJust)msg='👑 全コース全難易度制覇！「金シャチ人間」解放！！';
  else if(R.newRecord)msg='★ NEW RECORD ★';
  else if(R.unlockJust)msg='「'+R.unlockJust+'」が解放された！';
  else msg=DIFF[R.diffKey].label+'クリア！ほかの難易度にも挑戦しよう';
  c.fillStyle=R.goldJust?'#b8860d':(R.newRecord?'#d8372e':'#8c887e');
  c.font=(R.goldJust||R.newRecord)?'900 14px '+TXT_FONT:'12px '+TXT_FONT;
  c.fillText(msg,W/2,sy+22);
  BTNS=[];
  const nextIdx=G.courseIdx+1;
  const hasNext=nextIdx<COURSES.length&&COURSES[nextIdx].no<=save.unlockedNo;
  btn(c,W/2-350,438,200,52,'もういちど',{id:'retry',ghost:true});
  btn(c,W/2-125,438,230,52,'難易度をかえる',{id:'diff',ghost:true});
  if(hasNext)btn(c,W/2+130,438,220,52,'つぎのコースへ',{id:'next'});
  else btn(c,W/2+130,438,220,52,'コース選択へ',{id:'sel'});
  let act=clickedBtn();
  if(kb.confirm){act=hasNext?'next':'sel';kb.confirm=false;}
  if(act==='retry'){SFX.ui();startRun(G.courseIdx,G.diffKey);}
  if(act==='diff'){SFX.ui();G.screen='diffsel';}
  if(act==='next'){SFX.ui();G.courseIdx=nextIdx;G.screen='diffsel';}
  if(act==='sel'){SFX.ui();G.screen='coursesel';}
}

function drawGameover(c){

  BGS[R.course.bg](c,R.dist,G.t);
  drawGround(c,R);
  c.fillStyle='rgba(20,20,24,0.6)';c.fillRect(0,0,W,H);

  btn(c,W/2-120,362,240,50,'コース選択へ',{id:'quit',ghost:true});

  if(kb.confirm){act='retry';kb.confirm=false;}
  if(act==='retry'){SFX.ui();startRun(G.courseIdx,G.diffKey);}

function drawGallery(c){
  uiBg(c);
  const complete=save.gallery.length>=GALLERY_CARDS.length;
  c.fillStyle='#1c1c1e';c.font='900 26px '+TXT_FONT;c.textAlign='center';
  c.fillText('名古屋名所ギャラリー　'+save.gallery.length+'/'+GALLERY_CARDS.length,W/2,42);
  if(complete){
    c.fillStyle='#b8860d';c.font='900 15px '+TXT_FONT;
    c.fillText('🏆 コンプリート！あなたはもう立派なナゴヤ人間だ',W/2,68);
  }
  BTNS=[];
  const cw=148,chh=64,gap=10;
  const cols=6, x0=(W-(cw*cols+gap*(cols-1)))/2;
  GALLERY_CARDS.forEach((card,i)=>{
    const x=x0+(i%cols)*(cw+gap), y=84+Math.floor(i/cols)*(chh+gap);
    const got=save.gallery.includes(card.id);
    const sel=G.gallerySel===i;
    c.fillStyle=got?(sel?'#fff':'rgba(255,255,255,0.8)'):'rgba(190,186,176,0.5)';
    rr(c,x,y,cw,chh,10);c.fill();
    if(sel&&got){c.strokeStyle='#e0a818';c.lineWidth=3;rr(c,x,y,cw,chh,10);c.stroke();}
    if(got){
      c.fillStyle='#e0a818';
      c.save();c.translate(x+22,y+chh/2);
      c.beginPath();c.moveTo(-7,6);c.quadraticCurveTo(-2,-9,8,-7);c.quadraticCurveTo(3,-2,5,7);c.quadraticCurveTo(-1,3,-7,6);c.closePath();c.fill();
      c.restore();
      c.fillStyle='#1c1c1e';c.font='bold 13px '+TXT_FONT;c.textAlign='left';
      c.fillText(card.title,x+42,y+28);
      if(card.cameo){c.fillStyle='#a3690f';c.font='10px '+TXT_FONT;c.fillText('カメオ',x+42,y+45);}
    }else{
      c.fillStyle='#8c887e';c.font='900 22px '+TXT_FONT;c.textAlign='center';
      c.fillText('？',x+cw/2,y+chh/2+8);
    }
    BTNS.push({x,y,w:cw,h:chh,id:'card:'+i});
  });
  // 詳細パネル
  const selCard=GALLERY_CARDS[G.gallerySel];
  c.fillStyle='rgba(255,255,255,0.9)'; rr(c,W/2-360,232,720,196,14); c.fill();
  if(save.gallery.includes(selCard.id)){
    c.fillStyle='#d8372e';c.font='900 18px '+TXT_FONT;c.textAlign='left';
    c.fillText(selCard.title+(selCard.cameo?'（カメオ）':''),W/2-330,266);
    const text=selCard.cameo?CAMEO_TEXT[selCard.id]:TRIVIA[selCard.id].main;
    c.font='14px '+TXT_FONT;c.fillStyle='#3a3a3c';
    wrapText(c,text,W/2-330,294,660,22);
  }else{
    c.fillStyle='#8c887e';c.font='bold 16px '+TXT_FONT;c.textAlign='center';
    c.fillText('コースをクリアすると豆知識カードを獲得できます',W/2,330);
  }
  btn(c,W/2-110,452,220,50,'もどる',{id:'back',ghost:true});
  let act=clickedBtn();
  if(kb.confirm){act='back';kb.confirm=false;}
  if(act){
    if(act.startsWith&&act.startsWith('card:')){G.gallerySel=+act.slice(5);SFX.ui();}
    else if(act==='back'){SFX.ui();G.screen=G.galleryFrom||'title';}
  }
}

// ---------- メインループ ----------
let last=performance.now(), acc=0;
const STEP=1/120;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(dt>0.25)dt=0.25;
  G.t+=dt;
  if(G.screen==='play'){
    acc+=dt;
    while(acc>=STEP){ updatePlay(STEP); acc-=STEP; }
  }else{
    updFx(dt);
  }
  if(G.screen==='play'&&IN.ptr.clicked){
    const u=uiHitPlay(IN.ptr);
    if(u==='pause'){togglePause();IN.ptr.clicked=false;}
    if(!RUN.paused)IN.ptr.clicked=false;
  }
  // BGM切替（画面に応じて）
  const wantBgm = G.screen==='play' ? RUN.course.bg
    : (G.screen==='clear'||G.screen==='gameover') ? null : 'menu';
  if((BGM.conf?BGM.conf.key:null)!==wantBgm) bgmSet(wantBgm);
  switch(G.screen){
    case 'title': drawTitle(ctx); break;
    case 'howto': drawHowto(ctx); break;
    case 'charsel': drawCharsel(ctx); break;
    case 'coursesel': drawCoursesel(ctx); break;
    case 'diffsel': drawDiffsel(ctx); break;
    case 'play': drawPlay(ctx); break;
    case 'clear': drawClear(ctx); break;
    case 'gameover': drawGameover(ctx); break;
    case 'gallery': drawGallery(ctx); break;
  }
  IN.ptr.clicked=false;
}
requestAnimationFrame(frame);

// 検証用デバッグフック
window.__NRUN={
  get G(){return G}, get RUN(){return RUN}, get save(){return save}, IN, DIFF, COURSES,
  tick(sec){ if(G.screen==='play'){const n=Math.round(sec/STEP); for(let i=0;i<n;i++)updatePlay(STEP);} else {G.t+=sec;updFx(sec);} },
  render(){ switch(G.screen){
    case 'title':drawTitle(ctx);break; case 'howto':drawHowto(ctx);break;
    case 'charsel':drawCharsel(ctx);break; case 'coursesel':drawCoursesel(ctx);break;
    case 'diffsel':drawDiffsel(ctx);break; case 'play':drawPlay(ctx);break;
    case 'clear':drawClear(ctx);break; case 'gameover':drawGameover(ctx);break;
    case 'gallery':drawGallery(ctx);break; } },
  start(ci,dk){ G.courseIdx=ci||0; G.diffKey=dk||'normal'; startRun(G.courseIdx,G.diffKey); },
  surfaceAt:(x,yRef)=>RUN?surfaceAt(RUN,x,yRef):0,
  resetSave(){ try{localStorage.removeItem(SAVE_KEY);}catch(e){} loadSave(); },
  drawRunner:(o)=>{ctx.fillStyle='#f4f1ea';ctx.fillRect(0,0,W,H);drawRunner(ctx,W/2,H-60,o);},
  rig:(c,x,gy,o)=>drawRunner(c,x,gy,o),
  ctx,
};

})();
